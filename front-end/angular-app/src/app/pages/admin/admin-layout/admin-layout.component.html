<div class="min-h-screen bg-surface-container-low flex font-sans">
  <!-- Mobile sidebar backdrop -->
  <div *ngIf="isSidebarOpen" (click)="toggleSidebar()"
    class="fixed inset-0 z-40 bg-black/50 lg:hidden transition-opacity"></div>

  <!-- Sidebar -->
  <aside [class.translate-x-0]="isSidebarOpen" [class.-translate-x-full]="!isSidebarOpen"
    class="fixed inset-y-0 left-0 z-50 w-64 bg-surface-container-lowest border-r border-outline-variant/40 flex flex-col justify-between transition-transform duration-300 lg:translate-x-0 lg:static lg:z-auto">
    
    <!-- Sidebar Header -->
    <div>
      <div class="h-20 flex items-center px-6 border-b border-outline-variant/30">
        <a routerLink="/admin/dashboard" class="flex flex-col">
          <span class="text-xl font-display-lg tracking-[0.2em] text-primary font-bold uppercase">L'ELIXIR</span>
          <span class="text-[10px] text-on-surface-variant font-medium tracking-widest uppercase">Admin Back-office</span>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="p-4 space-y-1.5">
        <div class="px-3 pb-2 text-[11px] font-semibold text-outline uppercase tracking-wider">
          Phân hệ chính
        </div>
        <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="bg-primary text-white shadow-sm font-medium"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-on-surface-variant hover:bg-surface-container hover:text-primary transition group">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[20px] transition-transform group-hover:scale-110">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </div>
        </a>
      </nav>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-outline-variant/30 space-y-2">
      <a routerLink="/" target="_blank"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-on-surface-variant hover:text-primary hover:bg-surface-container transition">
        <span class="material-symbols-outlined text-[18px]">open_in_new</span>
        <span>Xem website khách hàng</span>
      </a>

      <button type="button" (click)="logout()"
        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-red-600 hover:bg-red-50 transition">
        <span class="material-symbols-outlined text-[18px]">logout</span>
        <span>Đăng xuất Back-office</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Topbar -->
    <header class="h-20 bg-surface-container-lowest border-b border-outline-variant/40 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <button type="button" (click)="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-on-surface hover:bg-surface-container">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div>
          <span class="text-xs text-outline font-medium">Bảng điều khiển quản trị</span>
          <h1 class="text-base sm:text-lg font-semibold text-on-surface tracking-tight">Hệ thống điều hành L'ELIXIR</h1>
        </div>
      </div>

      <!-- Topbar right profile info -->
      <div class="flex items-center gap-3 sm:gap-4">
        <div class="hidden sm:flex flex-col items-end">
          <span class="text-xs font-semibold text-on-surface">{{ currentAdmin?.fullName || 'Quản trị viên' }}</span>
          <span class="text-[11px] text-on-surface-variant">{{ currentAdmin?.email }}</span>
        </div>

        <span *ngIf="currentAdmin" [ngClass]="getRoleBadgeClass(currentAdmin.role)"
          class="px-2.5 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase border shadow-2xs">
          {{ currentAdmin.role }}
        </span>

        <button type="button" (click)="logout()" title="Đăng xuất"
          class="p-2 rounded-full text-outline hover:text-red-600 hover:bg-red-50 transition">
          <span class="material-symbols-outlined text-[20px]">power_settings_new</span>
        </button>
      </div>
    </header>

    <!-- Page Content Area -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
