<!-- components/cart-drawer.html -->
<aside id="cart-drawer" class="cart-drawer fixed right-0 top-0 h-full w-96 bg-white shadow-lg transform translate-x-full transition-transform">
  <div class="p-4 flex justify-between items-center">
    <h3>Giỏ hàng</h3>
    <button id="cart-close">✕</button>
  </div>
  <div id="cart-items" class="p-4 overflow-auto"></div>
  <div class="p-4 border-t">
    <div class="flex justify-between"><strong>Tổng</strong><span id="cart-total">0 VNĐ</span></div>
    <a href="../checkout/checkout.html" class="btn w-full mt-4">Thanh toán</a>
  </div>
</aside>
<script>
// Simple toggle script (call showCart()/hideCart())
function showCart(){document.getElementById('cart-drawer').style.transform='translateX(0)'}
function hideCart(){document.getElementById('cart-drawer').style.transform='translateX(100%)'}
</script>
