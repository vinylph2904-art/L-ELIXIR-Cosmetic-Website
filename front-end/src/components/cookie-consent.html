<div id="cookie-consent" class="cookie-consent fixed bottom-4 left-4 bg-white p-4 shadow rounded">
  <p>Website sử dụng cookie để cải thiện trải nghiệm. <button id="cookie-accept">Chấp nhận</button></p>
</div>
<script>document.getElementById('cookie-accept')?.addEventListener('click',()=>document.getElementById('cookie-consent').remove())</script>
